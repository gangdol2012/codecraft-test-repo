<!DOCTYPE html>
<html>
<head>
  <style>
    body { 
      background: #0f172a; 
      color: white; 
      font-family: system-ui, -apple-system, sans-serif; 
      display: flex; 
      flex-direction: column;
      justify-content: center; 
      align-items: center; 
      height: 100vh; 
      margin: 0; 
    }
    .card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 2rem;
      border-radius: 1rem;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }
    h1 { color: #818cf8; margin: 0; font-size: 3rem; }
    p { color: #94a3b8; margin-top: 1rem; }
  </style>
</head>
<body>
  <div class="card">
    <h1>CodeCraft IDE</h1>
    <p>Now powered by Monaco Editor</p>
  </div>
</body>
</html>
